<!DOCTYPE html>

<html>

<head>
  <title>ESP32 Sensor Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1 id="esp32-title">ESP32 Sensor Dashboard</h1>

  <p id = "data-source">Checking data source...</p>
    
  <div class="card-1">

        <h2>Distance</h2>

        <p class="sensor-value">
            <span id="distance">---</span> mm
        </p>

        <div class="distance-scale">

            <div id="distance-marker"></div>

            <div id="scale-labels"></div>

        </div>
    </div>

  <div class="sensor-grid">
    <div class="card-2">
        <h2>Accelerometer</h2>
        <p class="sensor-value">
            X: <span id="accelX">---</span> g
        </p>
        <p class="sensor-value">
            Y: <span id="accelY">---</span> g
        </p>
        <p class="sensor-value">
            Z: <span id="accelZ">---</span> g
        </p>

        <canvas id="accel-chart"></canvas>
    </div>

    <div class="card-2">
        <h2>Gyroscope</h2>
        <p class="sensor-value">
            X: <span id="gyroX">---</span> deg/s
        </p>
        <p class="sensor-value">
            Y: <span id="gyroY">---</span> deg/s
        </p>
        <p class="sensor-value">
            Z: <span id="gyroZ">---</span> deg/s
        </p>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
